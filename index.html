<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Raphael</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "@anthropic-ai/sdk": "https://esm.sh/@anthropic-ai/sdk@1.8.0"
} }
</script>
</head>
<body>
  <canvas id="scene"></canvas>

  <header class="top">
    <div class="brand"><span class="dot" id="statusDot"></span><span id="brandName">Raphael</span></div>
    <div class="top-actions">
      <button class="pill mode" id="modeBtn" aria-pressed="false" title="Mode Diskusi">⚡ Biasa</button>
      <button class="icon-btn" id="tasksBtn" aria-label="Tugas & catatan">☰</button>
      <button class="icon-btn" id="settingsBtn" aria-label="Pengaturan">⚙</button>
    </div>
  </header>

  <div class="status" id="statusText">Ketuk slime untuk bicara</div>

  <section class="captions" id="captions" aria-live="polite"></section>

  <footer class="bottom">
    <button class="pill" id="wakeBtn" aria-pressed="false" title="Mode kata panggil">👂 <span id="wakeLabel">Wake off</span></button>
    <button class="mic" id="micBtn" aria-label="Bicara">🎙</button>
    <button class="pill" id="kbBtn" title="Ketik">⌨</button>
  </footer>

  <form class="textbar hidden" id="textForm">
    <input id="textInput" autocomplete="off" placeholder="Ketik perintah…">
    <button>Kirim</button>
  </form>

  <!-- Settings -->
  <dialog id="settings">
    <form method="dialog" class="sheet">
      <h2>Pengaturan</h2>
      <label>Claude API key
        <input id="apiKey" type="password" placeholder="sk-ant-…" autocomplete="off">
        <small>Disimpan hanya di HP ini (localStorage). Buat di console.anthropic.com.</small>
      </label>
      <label>Nama asisten
        <input id="asstName" placeholder="Raphael">
      </label>
      <label>Kata panggil (wake word)
        <input id="wakeWord" placeholder="hai raphael">
        <small>Pisahkan beberapa dengan koma. Contoh: hai raphael, hey raphael, raphael</small>
      </label>
      <label>Nama kamu
        <input id="userName" placeholder="Master">
      </label>
      <label>Model
        <select id="model">
          <option value="claude-opus-5-5">Claude Opus 5.5 (paling pintar)</option>
          <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (seimbang)</option>
          <option value="claude-haiku-5-5">Claude Haiku 5.5 (paling cepat & murah)</option>
        </select>
      </label>
      <label>Suara
        <select id="voice"></select>
      </label>
      <label class="row">Kecepatan bicara <input id="rate" type="range" min="0.7" max="1.5" step="0.05"></label>
      <label class="row">Nada suara <input id="pitch" type="range" min="0.5" max="1.6" step="0.05"></label>
      <label class="row check"><input id="keepAwake" type="checkbox"> Jaga layar tetap menyala</label>
      <label class="row check"><input id="autoListen" type="checkbox"> Lanjut mendengar setelah menjawab</label>
      <div class="sheet-actions">
        <button value="reset" id="resetChat" class="ghost">Percakapan baru</button>
        <button value="save" id="saveSettings">Simpan</button>
      </div>
    </form>
  </dialog>

  <!-- Tasks / notes / memory -->
  <dialog id="panel">
    <form method="dialog" class="sheet">
      <h2>Memori Raphael</h2>
      <h3>Tugas</h3><ul id="taskList" class="list"></ul>
      <h3>Pengingat</h3><ul id="reminderList" class="list"></ul>
      <h3>Catatan</h3><ul id="noteList" class="list"></ul>
      <h3>Yang aku ingat tentangmu</h3><ul id="memoryList" class="list"></ul>
      <div class="sheet-actions"><button value="close">Tutup</button></div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
